<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Virtual Dog Park</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			display: flex;
			flex-direction: column;
			min-height: 100vh;
			margin: 0;
			font-family: "Trebuchet MS", sans-serif;
		}

		.site-header {
			background: #111;
			color: #fff;
		}

		main {
			flex: 1;
			position: relative;
			overflow: hidden;
			background-color: #f2f6ef;
		}

		.paw-pattern {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
		}

		.navigation {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 24px;
			max-width: 1200px;
			min-height: 68px;
			margin: 0 auto;
			padding: 12px 24px;
		}

		.brand,
		.navigation a {
			color: inherit;
			text-decoration: none;
		}

		.brand {
			font-size: 1.2rem;
			font-weight: 700;
			white-space: nowrap;
		}

		.navigation-links {
			display: flex;
			flex-wrap: wrap;
			gap: 28px;
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.navigation-links a {
			font-size: 0.95rem;
		}

		.navigation-links a:hover,
		.navigation-links a:focus-visible {
			color: #b7e4c7;
		}

		@media (max-width: 520px) {
			.navigation {
				align-items: flex-start;
				flex-direction: column;
				gap: 12px;
			}

			.navigation-links {
				gap: 12px 20px;
			}
		}
	</style>
</head>
<body>
	<header class="site-header" id="home">
		<nav class="navigation" aria-label="Main navigation">
			<a class="brand" href="#home">Virtual Dog Park</a>
			<ul class="navigation-links">
				<li><a href="#home">Home</a></li>
				<li><a href="#dogs">Dog Encyclopedia</a></li>
				<li><a href="#park">Virtual Park</a></li>
			</ul>
		</nav>
	</header>
	<main>
		<svg class="paw-pattern" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
			<defs>
				<pattern id="pawprints" width="220" height="180" patternUnits="userSpaceOnUse">
					<g fill="#4a7550" fill-opacity="0.2">
						<g transform="translate(57 55) rotate(-18)">
							<ellipse cx="-20" cy="-18" rx="6" ry="9" />
							<ellipse cx="-7" cy="-27" rx="6" ry="9" />
							<ellipse cx="8" cy="-27" rx="6" ry="9" />
							<ellipse cx="22" cy="-18" rx="6" ry="9" />
							<circle cx="3" cy="9" r="17" />
						</g>
						<g transform="translate(168 137) rotate(18) scale(0.78)">
							<ellipse cx="-20" cy="-18" rx="6" ry="9" />
							<ellipse cx="-7" cy="-27" rx="6" ry="9" />
							<ellipse cx="8" cy="-27" rx="6" ry="9" />
							<ellipse cx="22" cy="-18" rx="6" ry="9" />
							<circle cx="3" cy="9" r="17" />
						</g>
				</g>
			</pattern>
		</defs>
		<rect width="100%" height="100%" fill="url(#pawprints)" />
		</svg>
	</main>
</body>
</html>
